databaseChangeLog:
  # Schema first, seed last (V3 runs after all ALTER/CREATE migrations).
  - include:
      file: V1_create_tables.sql
      relativeToChangelogFile: true
  - include:
      file: V2_account_activation_tokens.sql
      relativeToChangelogFile: true
  - include:
      file: V4_add_is_deactivated_to_users.sql
      relativeToChangelogFile: true
  - include:
      file: V5_notifications_and_invoice_disputes.sql
      relativeToChangelogFile: true
  # V3_seed_data.sql — données de démo (doit rester en dernier).
  # Checksums historiques conservés pour les bases où V3 avait déjà tourné
  # avant V4/V5 ; les nouvelles installations exécutent V3 après le schéma complet.
  - include:
      file: V3_seed_data.sql
      relativeToChangelogFile: true
      validCheckSum: ANY
  # Patch idempotent pour les bases où V3 s'était exécuté avant V4/V5.
  - include:
      file: V6_seed_post_v5_patch.sql
      relativeToChangelogFile: true
  - include:
      file: V7_order_groups_and_dispute_previous_status.sql
      relativeToChangelogFile: true
  - include:
      file: V8_admin_notification_per_recipient.sql
      relativeToChangelogFile: true
  - include:
      file: V9_order_transport_method.sql
      relativeToChangelogFile: true
  - include:
      file: V10_order_number_sequence.sql
      relativeToChangelogFile: true
  - include:
      file: V11_official_b2b_catalog.sql
      relativeToChangelogFile: true
  - include:
      file: V12_erp_outbox_and_inbound.sql
      relativeToChangelogFile: true
  - include:
      file: V13_product_in_stock.sql
      relativeToChangelogFile: true

  